plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kellvyn.labreference'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kellvyn.labreference'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0-lab'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
