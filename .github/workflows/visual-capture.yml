name: Kellvyn Poco F6 virtual comparison (WebView vs native)

on:
  push:
    branches: [main]
    paths:
      - 'snapshot/android/**'
      - 'snapshot/src/**'
      - 'lab-reference-android/**'
      - 'scripts/prepare_poco_f6_virtual.sh'
      - 'scripts/capture_poco_f6_pair.py'
      - 'scripts/compare_screenshots.py'
      - '.github/workflows/visual-capture.yml'
  pull_request:
    paths:
      - 'snapshot/android/**'
      - 'snapshot/src/**'
      - 'lab-reference-android/**'
      - 'scripts/prepare_poco_f6_virtual.sh'
      - 'scripts/capture_poco_f6_pair.py'
      - 'scripts/compare_screenshots.py'
      - '.github/workflows/visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kellvyn-poco-f6-virtual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidates:
    name: Build native app and lab-only WebView reference
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail; yes | "$SDKMANAGER" --licenses >/dev/null; set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Test and build the native Kellvyn APK
        working-directory: snapshot/android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Build the isolated WebView reference APK (not part of Kellvyn)
        working-directory: lab-reference-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify both APK packages and signatures
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="snapshot/android/app/build/outputs/apk/debug/app-debug.apk"
          REFERENCE="lab-reference-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$NATIVE"
          test -s "$REFERENCE"
          unzip -t "$NATIVE" >/dev/null
          unzip -t "$REFERENCE" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$NATIVE" | grep -F "package: name='com.kellvyn.assistant'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$REFERENCE" | grep -F "package: name='com.kellvyn.labreference'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$NATIVE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$REFERENCE"
      - uses: actions/upload-artifact@v4
        with:
          name: kellvyn-native-debug-apk
          path: snapshot/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: kellvyn-lab-webview-reference-apk
          path: lab-reference-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  same-device-comparison:
    name: Render both versions on PocoF6Virtual and compare
    needs: [build-candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison tools
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Preflight capture harness syntax
        run: python -m py_compile scripts/capture_poco_f6_pair.py
      - uses: oven-sh/setup-bun@v2
      - name: Build the web reference and start its local server
        shell: bash
        run: |
          set -euo pipefail
          cd snapshot
          bun install --frozen-lockfile
          bun run test
          bun run build
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/kellvyn-web.log 2>&1 &
          echo $! > /tmp/kellvyn-web.pid
          cd ..
          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/kellvyn-web.log; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: kellvyn-native-debug-apk
          path: artifacts/apk/native
      - uses: actions/download-artifact@v4
        with:
          name: kellvyn-lab-webview-reference-apk
          path: artifacts/apk/reference
      - name: Stage the isolated APKs without filename collisions
        run: |
          mkdir -p artifacts/apk
          cp artifacts/apk/native/app-debug.apk artifacts/apk/app-debug.apk
          cp artifacts/apk/reference/app-debug.apk artifacts/apk/lab-reference-debug.apk
      - name: Create the original PocoF6Virtual device profile
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p artifacts
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          bash scripts/prepare_poco_f6_virtual.sh
      - name: Boot PocoF6Virtual, render WebView and native app, and compare
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p artifacts/poco-f6
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd PocoF6Virtual -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none > /tmp/poco-f6-virtual-emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'status=$?; set +e; cp /tmp/poco-f6-virtual-emulator.log artifacts/poco-f6/emulator.log 2>/dev/null; if [ "$status" -ne 0 ]; then timeout 12s adb logcat -d -t 3000 > artifacts/poco-f6/failure-logcat.txt 2>&1; timeout 12s adb shell dumpsys activity activities > artifacts/poco-f6/failure-activities.txt 2>&1; timeout 12s adb shell screencap -p /data/local/tmp/poco-f6-failure.png >/dev/null 2>&1; timeout 12s adb pull /data/local/tmp/poco-f6-failure.png artifacts/poco-f6/failure-screen.png >/dev/null 2>&1; fi; kill "$EMULATOR_PID" 2>/dev/null; exit "$status"' EXIT
          DEVICE_READY=0
          for attempt in $(seq 1 100); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat /tmp/poco-f6-virtual-emulator.log; exit 1; fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then DEVICE_READY=1; break; fi
            sleep 2
          done
          if [ "$DEVICE_READY" != "1" ]; then echo "PocoF6Virtual did not register in ADB"; exit 1; fi
          BOOTED=0
          for attempt in $(seq 1 120); do
            VALUE="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$VALUE" = "1" ]; then BOOTED=1; break; fi
            sleep 5
          done
          if [ "$BOOTED" != "1" ]; then echo "PocoF6Virtual did not finish Android boot"; exit 1; fi
          adb shell wm size 1220x2712
          adb shell wm density 440
          adb reverse tcp:4173 tcp:4173
          python scripts/capture_poco_f6_pair.py
          compare_pair() {
            local name="$1" reference="$2" candidate="$3"
            python scripts/compare_screenshots.py \
              --reference "artifacts/poco-f6/webview/$reference" \
              --candidate "artifacts/poco-f6/native/$candidate" \
              --output-dir "artifacts/poco-f6/comparison/$name" \
              --name "$name" \
              --reference-crop-top 66 --candidate-crop-top 66 \
              --reference-crop-bottom 66 --candidate-crop-bottom 66 \
              --channel-threshold 16
          }
          compare_pair main webview-main.png native-main.png
          compare_pair settings webview-settings.png native-settings.png
          compare_pair gold-settings webview-gold-settings.png native-gold-settings.png
          compare_pair gold-main webview-gold-main.png native-gold-main.png
          compare_pair effects-settings webview-effects-settings.png native-effects-settings.png
          compare_pair effects-main webview-effects-main.png native-effects-main.png
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/poco-f6/comparison")
          reports = []
          for name in ("main", "settings", "gold-settings", "gold-main", "effects-settings", "effects-main"):
              path = root / name / "comparison-report.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              reports.append(data["comparison"])
          output = {
              "status": "compared",
              "reference": "Android WebView APK (lab-only)",
              "candidate": "Kellvyn native Android APK",
              "sameVirtualDevice": "PocoF6Virtual",
              "sameViewport": "1220x2712 @ 440dpi",
              "hardwareProfile": "8GB RAM, 4 vCPU, Android 15 API 35, SwiftShader; Pixel 7 base device template with Poco F6 overrides",
              "screens": reports,
              "pixelPerfect": all(item["changedPixelsPercent"] == 0 for item in reports),
              "note": "The percentages are measured differences, not a claim of pixel-perfect parity. WebView is not included in the release APK.",
          }
          Path("artifacts/poco-f6/summary.json").write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(output, indent=2))
          PY
      - name: Upload same-device screenshots, overlays, heatmaps and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kellvyn-pocof6-webview-vs-native
          path: artifacts/poco-f6/**
          if-no-files-found: warn
          retention-days: 14
