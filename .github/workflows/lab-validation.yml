name: Kellvyn isolated parity lab
on:
  push:
    branches: [main]
    paths:
      - 'snapshot/**'
      - 'visual-tests/**'
      - 'scripts/compare_screenshots.py'
      - 'scripts/test_compare_screenshots.py'
      - 'scripts/check_ai_parity.py'
      - 'scripts/check_web_reference_lock.py'
      - 'ai-evaluation/**'
      - '.github/workflows/lab-validation.yml'
  pull_request:
    paths:
      - 'snapshot/**'
      - 'visual-tests/**'
      - 'scripts/compare_screenshots.py'
      - 'scripts/test_compare_screenshots.py'
      - 'scripts/check_ai_parity.py'
      - 'scripts/check_web_reference_lock.py'
      - 'ai-evaluation/**'
      - '.github/workflows/lab-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot comparison dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Run deterministic comparator tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check AI web/native contract parity
        run: python scripts/check_ai_parity.py
      - name: Protect the approved web appearance
        run: python scripts/check_web_reference_lock.py
      - name: Validate snapshot source inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s snapshot/src/components/kellvyn/KellvynApp.tsx
          test -s snapshot/src/components/kellvyn/DigitalRain.tsx
          test -s snapshot/android/app/src/main/java/com/kellvyn/assistant/MainActivity.java
          test -s snapshot/android/app/src/main/java/com/kellvyn/assistant/LocalBrain.kt
          test -s visual-tests/PARITY-MATRIX.md
          echo "Core web and native snapshot files are present."

  web-build:
    name: Build and test the frozen web reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install the locked web dependencies
        run: cd snapshot && bun install --frozen-lockfile
      - name: Run web behavior tests
        run: cd snapshot && bun run test
      - name: Build the web reference
        run: cd snapshot && bun run build

  native-build:
    name: Compile and test the native Android candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run Android unit tests and build debug APK
        working-directory: snapshot/android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Verify APK package, zip integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="snapshot/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.kellvyn.assistant'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
